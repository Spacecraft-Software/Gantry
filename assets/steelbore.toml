border       = "#6C71C4"

[themes.solarized-light.contrast.vs-background]  # vs #FDF6E3
foreground   = "4.13:1"
accent       = "3.41:1"
structure    = "4.06:1"
success      = "2.97:1"
error        = "4.29:1"
warning      = "2.98:1"
focus        = "2.93:1"
border       = "4.06:1"

[themes.solarized-light.contrast.vs-surface]  # vs #EEE8D5
foreground   = "3.64:1"
accent       = "3.00:1"
structure    = "3.57:1"
success      = "2.62:1"
error        = "3.77:1"
warning      = "2.62:1"
focus        = "2.58:1"
border       = "3.57:1"

[themes.solarized-light.rules]
conformance  = "non-conforming"
wcag-aa      = "fail"
adoptable-as-project-palette = "no"
accessible-mode = "steelbore-mono"
high-contrast-sibling = "not-defined"
surface-tokens-as-text = "forbidden"
surface-boundary-border = "structure"
surface-alt-shares-surface = "upstream defines a single elevated tone"
below-3-to-1 = ["success (2.62:1)", "warning (2.62:1)", "focus (2.58:1)"]

# -------------------------------------------------------------------------
# Mono variant (§11.1.1) — palette-independent. 4-bit ANSI only; defers hue
# entirely to the user's terminal palette. Selected explicitly or via NO_COLOR.
# -------------------------------------------------------------------------
[themes.steelbore-mono]
background  = "default"
foreground  = "default"
accent      = "bright-white"
structure   = "blue"
success     = "green"
error       = "red"
warning     = "yellow"
focus       = "reverse-video"
border      = "default"

# -------------------------------------------------------------------------
# Typography (§12) — FOSS-licensed fonts only. Palette-independent.
# -------------------------------------------------------------------------
[typography]
headings = { font = "Share Tech Mono", license = "OFL" }
body     = { font = "Inconsolata", license = "OFL" }
fallback = { font = "monospace", license = "system" }
