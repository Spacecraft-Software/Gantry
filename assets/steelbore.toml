# named family member (un-retired at v1.35). Legacy six-role contract; defines
# NO surface class, so §11.0.1 does not apply and foregrounds are measured
# against Void Navy alone.
# -------------------------------------------------------------------------
[palettes.steelbore-classic]
reference = "steelboreclassic-color-palette"
"Void Navy" = "#000027"
"Molten Amber" = "#D98E32"
"Steel Blue" = "#4B7EB0"
"Radium Green" = "#50FA7B"
"Red Oxide" = "#FF5C5C"
"Liquid Coolant" = "#8BE9FD"
"Steel Blue Lift" = "#7FAEDC"  # high-contrast only
"Red Oxide Lift" = "#FF8080"  # high-contrast only

[themes.steelbore-classic]
background  = "#000027"
foreground  = "#D98E32"
accent      = "#4B7EB0"
success     = "#50FA7B"
error       = "#FF5C5C"
info        = "#8BE9FD"

[themes.steelbore-classic.contrast.vs-background]  # vs #000027
foreground  = "7.64:1"
accent      = "4.77:1"
success     = "14.87:1"
error       = "6.74:1"
info        = "14.74:1"

[themes.steelbore-classic.rules]
contract     = "legacy-six-role"
surface-class = "not-defined"

[themes.steelbore-classic-high-contrast]
background  = "#000027"
foreground  = "#D98E32"
accent      = "#7FAEDC"  # lifted
success     = "#50FA7B"
error       = "#FF8080"  # lifted
info        = "#8BE9FD"

[themes.steelbore-classic-high-contrast.contrast.vs-background]  # vs #000027
foreground  = "7.64:1"
accent      = "8.73:1"
success     = "14.87:1"
error       = "8.41:1"
info        = "14.74:1"

