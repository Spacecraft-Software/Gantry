# -------------------------------------------------------------------------
# Steelbore Green (§11.3.8) — anchors: Vampire Black #0D0208 / Erin #00FF41
# The Matrix palette. Erin is the FOREGROUND, not the accent: body text is the
# green, as in the films' terminals. Steelbore Classic sets the precedent for a
# non-neutral foreground (Molten Amber). Rain Head is the bright leading glyph
# of the digital rain and carries `accent`/`focus`.
# Cascade Green is Islam Green #008F11 (4.80:1, too dark for text on a surface)
# deepened until it clears 4.5:1 on all three backgrounds, as §11.3.4 deepens
# NavyWhite's status hues. Dark Green (Traditional), Australia Green and Islam
# Green are carried as non-role fills — none reaches the text floor.
# For a neutral-text reading of the same colours, see steelbore-greenalt.
