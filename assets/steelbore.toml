# -------------------------------------------------------------------------
# Steelbore BlackPinkPanther (§11.3.7) — anchors: Runway Black #000000 / Hot Pink #F400A1
# NEW AT v2.08, AND IT REUSES A SLUG. Until v2.07 this slug named the violet
# palette now called steelbore-magnetar. A consumer pinned to it renders
# different colours with no error; the break is deliberate and documented.
# Black / white / hot pink, after the Victoria's Secret main brand — neon and
# cool rather than the softer sub-brand pink. Glowing Pink is the pressed state.
# The surfaces are deliberately pink-tinted rather than neutral black: in the
# storefronts this palette is drawn from, backlit pink is the dominant FIELD and
# glossy black is the frame around it. Backlit Rose is the boldest surface that
# still keeps Hot Pink above 4.5:1 on it (4.72:1) — pinker fails the floor.
